# שער הסודות. רץ **לפני** שכל דבר אחר נכנס — הריפו ציבורי, ובוטים
# סורקים מפתחות דלופים תוך דקות מהעלאה, לא תוך ימים.
name: gitleaks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Install gitleaks (pinned + verified)
        run: |
          set -euo pipefail
          F="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$F" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${F}"
          echo "${GITLEAKS_SHA256}  ${F}" | sha256sum -c -
          tar xzf "$F" gitleaks
      - name: Scan working tree
        run: ./gitleaks dir . --no-banner --redact
      - name: Scan full history
        run: ./gitleaks git . --no-banner --redact
