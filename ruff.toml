# תצורת ruff — מוצהרת בקובץ ולא בשורת הפקודה, כדי שהריצה המקומית
# והריצה ב-CI יסכימו. סט חוקים משתמע נודד עם גרסת הכלי, ואז "עבר
# אצלי" ו"עבר ב-CI" הם שתי בדיקות שונות.

line-length = 88

[lint]
# ‏E/W — pycodestyle, ‏F — pyflakes (המערכת שתופסת ייבוא מת ושם לא
# מוגדר), ‏PLE — **שגיאות** של pylint בלבד. מה שאינו כאן — ‏UP031
# (‏%-format), ‏PLW1510, ‏SIM — הוא סגנון, ואינו שובר דבר בקוד הזה.
select = ["E", "W", "F", "PLE"]

ignore = [
    # ‏PLE2502 (bidirectional-unicode) — **הכרעה מתועדת של הבעלים**
    # (‏ImageCtl #199), לא נוחות. הקוד כאן מתועד בעברית, וההערות
    # מכילות ‏RLM (‏U+200F) שמפריד בין טקסט עברי לאסימון לטיני צמוד.
    # ‏208 מופעים ב-24 קבצים בריפו הזה.
    #
    # החוק נועד ל-Trojan Source (‏CVE-2021-42574) — תווי **override**
    # (‏U+202A–U+202E, ‏U+2066–U+2069) שמסדרים קוד מחדש כך שהוא נקרא
    # אחרת ממה שהוא מריץ. נמדד: הריפו מכיל **רק** ‏U+200F, שהוא סימן
    # כיוון ולא override — הוא אינו יכול לסדר אסימונים מחדש.
    #
    # ניקוי רוחבי של התווים האלה כבר הרס טקסט עברי ב-2026-08-31 ושינה
    # משמעות של טסט. אין לחדש אותו בלי הכרעה חדשה של הבעלים.
    "PLE2502",
]
