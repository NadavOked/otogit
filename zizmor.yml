# תצורת zizmor. שני סוגי רשומות כאן, ואסור לבלבל ביניהן:
#
# ‏1. **מדיניות** — הכרעה שתקפה לתמיד. ‏unpinned-uses.
# ‏2. **חוב מוצהר** — ‏ignore על קובץ קיים שנכתב לפני שהכלי נוסף.
#    כל רשומה כזו היא ממצא אמיתי שלא תוקן, לא ממצא שנדחה. היא נספרת,
#    היא נראית, ויש לה בעלים. השתקה שקטה היא הדרך שבה חוב נעלם.

rules:
  # **מדיניות.** ‏zizmor דורש כברירת מחדל הצמדה ל-hash לכל פעולה.
  # ההכרעה כאן: ‏tag יציב מספיק ל-`actions/*` ו-`github/*`, שהן
  # פעולות של GitHub עצמה על ריפו שהיא מארחת — מי שיכול לשכתב שם
  # תג יכול ממילא לשכתב את הריצה. לכל שאר הפעולות, מצד שלישי,
  # נדרש hash: שם שכתוב תג הוא בדיוק וקטור התקיפה.
  unpinned-uses:
    config:
      policies:
        "actions/*": ref-pin
        "github/*": ref-pin
        "*": hash-pin

  # **חוב מוצהר.** ‏checkout משאיר את הטוקן ב-.git/config, וכל צעד
  # אחרי הצעד הזה יכול לקרוא אותו. התיקון הוא
  # `persist-credentials: false`, והוא שייך לקבצים האלה — ולכל אחד
  # מהם יש בעלים ומחזור חיים משלו. ‏PR שמוסיף כלי בדיקה אינו המקום
  # לשנות workflow קיים; זה נפתח כ-Issue נפרד.
  # הקבצים החדשים ב-PR הזה **כן** נבדקים — כאן אין ignore עליהם.
  artipacked:
    ignore:
      - tests.yml
      - gitleaks.yml
      - agent-review.yml

  # **חוב מוצהר.** ‏tests.yml רץ בלי `permissions:` ולכן מקבל את
  # ברירת המחדל של הריפו במקום contents:read. אותו נימוק כמו למעלה:
  # הקובץ קיים, השינוי שלו אינו חלק מהוספת הכלי.
  excessive-permissions:
    ignore:
      - tests.yml
